name: Validate public catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JS syntax
        run: node --check assets/site.js
      - name: Validate project catalog and local paths
        run: python3 scripts/validate.py
      - name: Verify Brahmi Mac source layers and inline JavaScript
        run: python3 scripts/verify_brahmi.py
      - name: Verify Brahmi phonetic atlas source, completeness and JavaScript
        run: python3 scripts/verify_phonetic_atlas.py
      - name: Verify native macOS Cyrillic and Devanagari layouts and Hindi localization
        run: python3 scripts/verify_brahmi_extended_locales.py
      - name: Verify scientifically reviewed descriptions and catalog SEO
        run: python3 scripts/verify_brahmi_editorial.py
      - name: Verify Mac German ISO Normal Shift rendering source and original Brahmi map
        run: python3 scripts/verify_brahmi_german_visual.py
      - name: Verify complete trainer Phrase Atlas, eight Mac layouts and script identity
        run: python3 scripts/verify_brahmi_phrase_atlas.py
      - name: Verify v0.9.1 compact dual live input cockpit invariants
        run: python3 scripts/verify_brahmi_dual_cockpit.py
      - name: Verify source-backed multilingual US and JIS keycaps and responsive states
        run: python3 scripts/verify_brahmi_cross_layout.py
      - name: Verify all eight Normal Shift keycaps and multilingual viewport fidelity
        run: python3 scripts/verify_brahmi_all_layouts.py
      - name: Verify BFG research core against independent enumeration
        run: node tests/bfg-core.test.cjs
      - name: Verify complete phonetic dictionary and source-linked chords
        run: python3 scripts/verify_brahmi_pronunciation.py
