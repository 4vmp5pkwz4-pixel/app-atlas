name: Validate public catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JS syntax
        run: node --check assets/site.js
      - name: Validate project catalog and local paths
        run: python3 scripts/validate.py
