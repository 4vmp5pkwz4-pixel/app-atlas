name: Monitor live applications

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/health.yml
  schedule:
    - cron: '23 04 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check live pages and mirrored source
        run: python3 scripts/check_sites.py
