name: Bug report
description: Report a reproducible problem with a public APP ATLAS project
title: "[Bug] "
body:
  - type: dropdown
    id: project
    attributes:
      label: Which project?
      options:
        - APP ATLAS website
        - Brahmi Atelier
        - NORMA
        - Buddhabrot
        - HCC
        - HOPF OmniAtlas
        - UPRS Möbius–Hopf
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: Device, browser and OS
  - type: markdown
    attributes:
      value: "Never include passwords, API keys, personal records or private repository contents."
