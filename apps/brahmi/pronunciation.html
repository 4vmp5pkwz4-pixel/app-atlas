function handoff(s,kind,status){try{if(kind==="practice"){if(!canPractice(s))throw Error();sessionStorage.setItem("brahmi-dictionary-practice-v1",s);location.href=$("back").href}else{sessionStorage.setItem("bfg-lab-input-v1",s);location.href="./research-lab.html"}}catch(e){$(status).textContent=tr("transferFail")}}
function shuffled(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newQuiz(){const pool=R.filter(r=>r.n>=0x11013&&r.n<=0x11033);let next=shuffled([...pool]).find(r=>r!==question);question=next;answered=false;$("question").textContent=next.glyph;$("feedback").textContent="";$("answers").replaceChildren();for(const r of shuffled([next,...shuffled(pool.filter(x=>x!==next)).slice(0,3)])){const b=btn(r.roman,"",()=>{if(answered)return;answered=true;total++;if(r===next)correct++;$("feedback").textContent=r===next?tr("right"):tr("wrong")+next.roman;$("feedback").className=r===next?"ok":"bad";$("score").textContent=correct+" / "+total;for(let x of $("answers").children)x.disabled=true});$("answers").append(b)}}
function localize(){locale=$("lang").value;document.documentElement.lang=locale;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=tr(e.dataset.t));render();showDetail();matrix();options();syllable()}
$("lang").onchange=localize;$("search").oninput=render;$("kind").onchange=render;$("base").onchange=syllable;$("vowel").onchange=syllable;$("next").onclick=newQuiz;$("practice").onclick=()=>handoff(practiceText(current),"practice","handoff");$("practiceSyllable").onclick=()=>handoff(syllable(),"practice","syllableStatus");$("toResearch").onclick=()=>handoff(current.glyph,"research","handoff");$("researchSyllable").onclick=()=>handoff(syllable(),"research","syllableStatus");
$("listen").onclick=()=>{const v=voice();if(!v||!current.hindi)return;try{const u=new SpeechSynthesisUtterance(current.hindi);u.voice=v;u.lang=v.lang;u.rate=.75;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){$("voiceStatus").textContent=tr("noVoice")}};if(window.speechSynthesis)window.speechSynthesis.addEventListener?.("voiceschanged",showDetail);
$("export").onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download="brahmi-pronunciation.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
try{const p=JSON.parse(localStorage.getItem("brahmi-atelier-2026-v1")||"null");if(["en","ru","de","ja","hi"].includes(p?.lang))$("lang").value=p.lang;const from=sessionStorage.getItem("brahmi-dictionary-return-v1");if(from==="brahmi.html")$("back").href="./brahmi.html";sessionStorage.removeItem("brahmi-dictionary-return-v1")}catch(e){}
const hex=location.hash.slice(1).replace(/^U\+/i,"");if(/^[0-9a-f]{5}$/i.test(hex)&&M.has(parseInt(hex,16)))current=M.get(parseInt(hex,16));localize();newQuiz();window.BrahmiPronunciationTest={rows:R,syllable,select};
