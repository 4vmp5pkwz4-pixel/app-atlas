function keycap(key,layout){const physical=D.physical[layout]||D.physical.en;if(Object.prototype.hasOwnProperty.call(physical,key))return physical[key];if(key.startsWith("Key"))return key.slice(3);if(key.startsWith("Digit"))return key.slice(5);return key}
function initial(s){return(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/gi,"").charAt(0).toUpperCase()}
function score(layout){return ROWS.filter(x=>x.n>=0x11013&&x.n<=0x11034).filter(x=>x.chords.length&&initial(x.roman)===keycap(x.chords[0].key,layout)).length}
if(ROWS.length!==115||ROWS.filter(x=>x.chords.length).length!==106||score("en")!==26||score("de")!==25)throw Error("Source or phonetic metric changed");
let selected=[];
function l(){return I[$("lang").value]||I.en}
function bars(){const items=[["English QWERTY",score("en")],["日本語 JIS Romaji",score("ja")],["Deutsch QWERTZ",score("de")]];$("bars").innerHTML=items.map(x=>'<div class="barrow"><span>'+x[0]+'</span><div class="track"><div class="fill" style="width:'+(100*x[1]/34)+'%"></div></div><strong>'+x[1]+'/34</strong></div>').join("")}
function render(){const q=$("query").value.toLowerCase().trim(),f=$("family").value,c=$("coverage").value,m=$("layout").value;selected=ROWS.filter(x=>(f==="all"||Number(f)===x.family)&&(c==="all"||(c==="yes"?x.chords.length>0:x.chords.length===0))&&(!q||["U+"+x.hex,x.char,x.roman,x.dev,...x.chords.map(y=>y.key),...x.chords.map(y=>keycap(y.key,m))].join(" ").toLowerCase().includes(q)));$("count").textContent=selected.length+" / 115";$("table").innerHTML=selected.map(x=>{const chord=x.chords.slice(0,3).map(y=>MOD[y.layer]+y.key).join(" / ")||"—",legend=x.chords.slice(0,3).map(y=>MOD[y.layer]+keycap(y.key,m)).join(" / ")||"—";return'<tr><td class="mono">U+'+x.hex+'</td><td class="glyph">'+x.char+'</td><td>'+l().families[x.family]+'</td><td>'+(x.roman||"—")+'</td><td>'+(x.dev||"—")+'</td><td class="mono">'+chord+'</td><td>'+legend+'</td><td class="'+(x.chords.length?"yes":"no")+'">'+(x.chords.length?"✓":"—")+'</td></tr>'}).join("")}
function translate(){const t=l(),oldF=$("family").value,oldC=$("coverage").value;document.documentElement.lang=$("lang").value;Object.keys(t).forEach(k=>{if(typeof t[k]==="string"&&$(k))$(k).textContent=t[k]});$("family").innerHTML=t.families.map((v,i)=>'<option value="'+(i||"all")+'">'+v+'</option>').join("");$("coverage").innerHTML=t.coverages.map((v,i)=>'<option value="'+["all","yes","no"][i]+'">'+v+'</option>').join("");$("family").value=oldF||"all";$("coverage").value=oldC||"all";bars();render()}
$("nAll").textContent=ROWS.length;$("nYes").textContent=ROWS.filter(x=>x.chords.length).length;$("nNo").textContent=ROWS.filter(x=>!x.chords.length).length;$("sourceCredit").textContent=D.license+" · Git blob "+D.sourceBlobSha;
$("lang").value=["ru","en","de","ja"].includes((navigator.language||"").slice(0,2))?(navigator.language||"").slice(0,2):"en";
$("lang").addEventListener("change",translate);$("query").addEventListener("input",render);for(const x of ["family","coverage","layout"])$(x).addEventListener("change",render);
$("csv").addEventListener("click",()=>{const cols=[["Code","Glyph","IAST","Devanagari","Group","Physical chords","Key legends","Has original key"]].concat(selected.map(x=>["U+"+x.hex,x.char,x.roman,x.dev,x.family,x.chords.map(c=>MOD[c.layer]+c.key).join(" | "),x.chords.map(c=>MOD[c.layer]+keycap(c.key,$("layout").value)).join(" | "),x.chords.length?"yes":"no"]));const csv="\uFEFF"+cols.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),b=new Blob([csv],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="brahmi-phonetic-atlas.csv";a.click();URL.revokeObjectURL(u)});
translate();window.BrahmiAtlasTest={ROWS,score,visible:()=>selected};
</script></body></html>
